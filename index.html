<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Open+Sans+Condensed:wght@300;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background-color: #FAEFD1;
  font-family: 'Open Sans Condensed', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  background: white;
  padding: 50px 40px;
  border-radius: 20px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.08);
  text-align: center;
  max-width: 420px;
  width: 90%;
}

h1 {
  font-family: 'Cinzel Decorative', serif;
  color: #53683B;
  font-size: 28px;
  margin-bottom: 10px;
}

.subtitle {
  font-family: 'Cinzel Decorative', serif;
  font-size: 16px;
  margin-bottom: 30px;
  color: #53683B;
}

input {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #ddd;
  font-size: 16px;
  margin-bottom: 15px;
  background-color: #FAEFD1;
}

button {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: none;
  background-color: #53683B;
  color: #FAEFD1;
  font-size: 16px;
  cursor: pointer;
  letter-spacing: 1px;
  transition: 0.3s ease;
}

button:hover {
  background-color: #42552f;
}

#result {
  margin-top: 30px;
  font-size: 18px;
  color: #53683B;
  animation: fadeIn 0.6s ease-in-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="container">
  <h1>Find Your Seat</h1>
  <div class="subtitle">We can’t wait to celebrate with you</div>

  <input type="text" id="nameInput" placeholder="Enter your full name">
  <button onclick="findSeat()">SEARCH</button>

  <div id="result"></div>
</div>

<script>
const sheetURL = "SEAT.csv";

let seatingData = [];

// Robust CSV parser (handles quotes)
function parseCSV(text) {
  const rows = text.split("\n").slice(1);
  return rows.map(row => {
    const matches = row.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);
    if (!matches || matches.length < 2) return null;

    return {
      name: matches[0].replace(/"/g, "").trim().toLowerCase(),
      table: matches[1].replace(/"/g, "").trim()
    };
  }).filter(Boolean);
}

async function loadData() {
  try {
    const response = await fetch(sheetURL);
    const text = await response.text();
    seatingData = parseCSV(text);
    console.log("Guest list loaded:", seatingData);
  } catch (err) {
    console.error("Failed to load guest list", err);
  }
}

loadData();

function findSeat() {
  const input = document.getElementById("nameInput").value.trim().toLowerCase();
  const result = document.getElementById("result");

  if (!input) {
    result.innerHTML = "Please enter your full name.";
    return;
  }

  if (seatingData.length === 0) {
    result.innerHTML = "Loading guest list… please try again.";
    return;
  }

  const guest = seatingData.find(g => g.name === input);

  if (guest) {
    result.innerHTML =
      `Welcome <strong>${guest.name.toUpperCase()}</strong><br>
       You are seated at <strong>${guest.table}</strong><br><br>
       See you on the dance floor 🥂`;
  } else {
    result.innerHTML =
      "We couldn’t find your name.<br>Please check spelling.";
  }
}
</script>

</body>
</html>
