<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Open+Sans+Condensed:wght@300;700&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  background-color: #FAEFD1;
  font-family: 'Open Sans Condensed', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  background: white;
  padding: 50px 40px;
  border-radius: 20px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.08);
  text-align: center;
  max-width: 420px;
  width: 90%;
}

h1 {
  font-family: 'Cinzel Decorative', serif;
  color: #53683B;
  font-size: 28px;
  margin-bottom: 10px;
}

.subtitle {
  font-family: 'The Youngest Serif', serif;
  font-size: 16px;
  margin-bottom: 30px;
  color: #53683B;
}

input {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #ddd;
  font-size: 16px;
  margin-bottom: 15px;
  background-color: #FAEFD1;
}

button {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: none;
  background-color: #53683B;
  color: #FAEFD1;
  font-size: 16px;
  cursor: pointer;
  letter-spacing: 1px;
  transition: 0.3s ease;
}

button:hover {
  background-color: #42552f;
}

#result {
  margin-top: 30px;
  font-size: 18px;
  color: #53683B;
  animation: fadeIn 0.6s ease-in-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

</style>
</head>
<body>

<div class="container">
  <h1>Find Your Seat</h1>
  <div class="subtitle">We can’t wait to celebrate with you</div>

  <input type="text" id="nameInput" placeholder="Enter your full name">
  <button onclick="findSeat()">SEARCH</button>

  <div id="result"></div>
</div>

<script>
const sheetURL = https://docs.google.com/spreadsheets/d/e/2PACX-1vSV_ZeKMtJzFyK0awJzJl8diDFc5yOEHmrTD8wY9NqsMWbp9hcwcT7SoJ6hmdS-50MatpvLEe62KuuY/pub?output=csv;

let seatingData = [];

fetch(sheetURL)
  .then(response => response.text())
  .then(data => {
    const rows = data.split("\n").slice(1);
    rows.forEach(row => {
      const columns = row.split(",");
      if(columns.length >= 2){
        seatingData.push({
          name: columns[0].trim().toLowerCase(),
          table: columns[1].trim()
        });
      }
    });
  });

function findSeat() {
  const inputName = document.getElementById("nameInput").value.trim().toLowerCase();
  const guest = seatingData.find(g => g.name === inputName);

  if (guest) {
    document.getElementById("result").innerHTML =
      "Welcome <strong>" + guest.name.toUpperCase() +
      "</strong><br>You are seated at <strong>" + guest.table +
      "</strong><br><br>See you on the dance floor 🥂";
  } else {
    document.getElementById("result").innerHTML =
      "We couldn't find your name.<br>Please check the spelling.";
  }
}
</script>

</body>
</html>
